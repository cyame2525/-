<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 to MIDI Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        main {
            padding: 40px;
        }

        section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #333;
        }

        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .file-name {
            margin-top: 15px;
            color: #666;
        }

        canvas {
            width: 100%;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            margin-top: 15px;
            display: block;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .message {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
        }

        .setting-item label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .setting-item input,
        .setting-item select {
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .setting-item input:focus,
        .setting-item select:focus {
            outline: none;
            border-color: #667eea;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #ddd;
            color: #666;
        }

        .info-text {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 4px;
            color: #0c5460;
            font-size: 0.95em;
        }

        @media (max-width: 768px) {
            main {
                padding: 20px;
            }
            section {
                padding: 15px;
            }
            header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 MP3 to MIDI Converter</h1>
            <p>正確なタイミング・長さでMIDIに変換</p>
        </header>

        <main>
            <div id="message" class="message"></div>

            <!-- ファイルアップロード -->
            <section>
                <h2>📁 ファイル選択</h2>
                <input type="file" id="audioFile" accept=".mp3,.wav,.m4a" style="display:none;">
                <button class="btn-upload" onclick="selectFile()">
                    📁 MP3/WAVファイルを選択
                </button>
                <p id="fileName" class="file-name">ファイルが選択されていません</p>
            </section>

            <!-- 波形表示 -->
            <section>
                <h2>📊 波形</h2>
                <canvas id="waveform" width="800" height="120"></canvas>
            </section>

            <!-- 再生コントロール -->
            <section>
                <h2>🔊 再生</h2>
                <div class="controls">
                    <button id="playBtn" class="btn btn-primary" onclick="playAudio()" disabled>
                        ▶ 再生
                    </button>
                    <button id="stopBtn" class="btn btn-secondary" onclick="stopAudio()" disabled>
                        ⏹ 停止
                    </button>
                </div>
                <p id="timeInfo" class="file-name" style="margin-top: 10px;"></p>
            </section>

            <!-- MIDI生成設定 -->
            <section>
                <h2>⚙️ MIDI設定</h2>
                <div class="info-text">
                    💡 MP3/WAVファイルから「ノート」を自動抽出して、元の長さを保ったままMIDIに変換します。
                </div>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label for="bpmInput">BPM:</label>
                        <input type="number" id="bpmInput" value="120" min="40" max="300">
                    </div>
                    <div class="setting-item">
                        <label for="instrumentSelect">楽器:</label>
                        <select id="instrumentSelect">
                            <option value="0">ピアノ</option>
                            <option value="24">ギター</option>
                            <option value="32">ベース</option>
                            <option value="40">バイオリン</option>
                            <option value="48">弦楽器</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="thresholdInput">検出感度 (0-1):</label>
                        <input type="number" id="thresholdInput" value="0.2" min="0" max="1" step="0.05">
                    </div>
                </div>
            </section>

            <!-- 変換ボタン -->
            <section>
                <h2>💾 変換</h2>
                <button id="convertBtn" class="btn btn-success" onclick="convertToMIDI()" disabled style="width: 100%; padding: 15px;">
                    🎵 MP3/WAV → MIDI に変換
                </button>
            </section>
        </main>

        <footer>
            <p>このアプリは正確なタイミングとノートの長さを保つMP3/WAV→MIDI変換ツールです</p>
        </footer>
    </div>

    <script>
        let audioContext;
        let audioBuffer;
        let audioSource;
        let startTime;
        let pauseTime = 0;
        let isPlaying = false;

        // ページ読み込み時の初期化
        window.addEventListener('load', () => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                showMessage('準備完了！', 'success');
            } catch(e) {
                showMessage('Web Audio APIが利用できません', 'error');
            }
        });

        // メッセージ表示
        function showMessage(text, type = 'success') {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            setTimeout(() => { el.className = 'message'; }, 5000);
        }

        // ファイル選択
        function selectFile() {
            document.getElementById('audioFile').click();
        }

        // ファイルアップロード処理
        document.getElementById('audioFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fileName').textContent = '📄 ' + file.name;
            showMessage('ファイルを読み込み中...', 'success');

            const reader = new FileReader();
            reader.onload = (evt) => {
                audioContext.decodeAudioData(
                    evt.target.result,
                    (buffer) => {
                        audioBuffer = buffer;
                        drawWaveform(buffer);
                        document.getElementById('playBtn').disabled = false;
                        document.getElementById('convertBtn').disabled = false;
                        updateTimeInfo();
                        showMessage('ファイルが読み込まれました！', 'success');
                    },
                    (err) => {
                        showMessage('デコードエラー：' + err, 'error');
                    }
                );
            };
            reader.readAsArrayBuffer(file);
        });

        // 波形描画
        function drawWaveform(buffer) {
            const canvas = document.getElementById('waveform');
            const ctx = canvas.getContext('2d');
            const data = buffer.getChannelData(0);

            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 1;
            ctx.beginPath();

            const step = Math.ceil(data.length / canvas.width);
            const amp = canvas.height / 2;

            for (let i = 0; i < canvas.width; i++) {
                let min = 0, max = 0;
                for (let j = i * step; j < (i + 1) * step && j < data.length; j++) {
                    min = Math.min(min, data[j]);
                    max = Math.max(max, data[j]);
                }
                const y = amp + min * amp;
                if (i === 0) ctx.moveTo(i, y);
                else ctx.lineTo(i, y);
            }
            ctx.stroke();
        }

        // 時間情報の表示
        function updateTimeInfo() {
            if (!audioBuffer) return;
            const duration = audioBuffer.duration;
            const minutes = Math.floor(duration / 60);
            const seconds = Math.floor(duration % 60);
            document.getElementById('timeInfo').textContent = 
                `⏱️ 長さ: ${minutes}:${seconds.toString().padStart(2, '0')} (${duration.toFixed(2)}秒)`;
        }

        // 再生
        function playAudio() {
            if (!audioBuffer || isPlaying) return;

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            try {
                audioSource = audioContext.createBufferSource();
                audioSource.buffer = audioBuffer;
                audioSource.connect(audioContext.destination);
                
                startTime = audioContext.currentTime - pauseTime;
                audioSource.start(0, pauseTime);

                document.getElementById('playBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                isPlaying = true;

                audioSource.onended = () => {
                    resetPlayState();
                };

                showMessage('再生中...', 'success');
            } catch(e) {
                showMessage('再生エラー: ' + e.message, 'error');
            }
        }

        // 停止
        function stopAudio() {
            if (audioSource) {
                audioSource.stop();
            }
            resetPlayState();
            pauseTime = 0;
            showMessage('停止', 'success');
        }

        function resetPlayState() {
            document.getElementById('playBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            isPlaying = false;
        }

        // MIDI変換メイン処理
        function convertToMIDI() {
            if (!audioBuffer) {
                showMessage('ファイルを選択してください', 'error');
                return;
            }

            try {
                showMessage('MIDIを生成中...', 'success');

                const bpm = parseInt(document.getElementById('bpmInput').value);
                const instrument = parseInt(document.getElementById('instrumentSelect').value);
                const threshold = parseFloat(document.getElementById('thresholdInput').value);

                // ノートを抽出
                const notes = extractNotes(audioBuffer, bpm, threshold);
                console.log('抽出されたノート数:', notes.length);
                console.log('ノートの詳細:', notes.slice(0, 5));

                // MIDIファイルを生成
                const midiData = generateMIDI(notes, bpm, instrument, audioBuffer.duration);

                // ダウンロード
                downloadMIDI(midiData, 'converted.mid');

                showMessage(`✅ MIDI生成完了！${notes.length}個のノートを変換しました。`, 'success');
            } catch (e) {
                console.error(e);
                showMessage('エラー：' + e.message, 'error');
            }
        }

        // オーディオからノートを抽出
        function extractNotes(buffer, bpm, threshold) {
            const notes = [];
            const data = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            const totalDuration = buffer.duration;

            // 時間窓のサイズ（デフォルト50ms）
            const windowSize = Math.floor(sampleRate * 0.05);
            const hopSize = Math.floor(sampleRate * 0.025); // 25msずつスライド

            let currentTime = 0;

            for (let i = 0; i < data.length - windowSize; i += hopSize) {
                // RMS（音量）を計算
                let sum = 0;
                for (let j = 0; j < windowSize; j++) {
                    sum += data[i + j] * data[i + j];
                }
                const rms = Math.sqrt(sum / windowSize);

                // しきい値を超えた場合だけ周波数を推定
                if (rms > threshold) {
                    const freq = estimateFrequency(data, i, windowSize, sampleRate);

                    if (freq > 50 && freq < 4000) { // 有効な周波数範囲
                        const note = frequencyToMidiNote(freq);
                        const velocity = Math.min(127, Math.max(20, Math.round(rms * 300)));

                        // 同じノートが続く場合は長さを延ばす
                        if (notes.length > 0 && notes[notes.length - 1].note === note) {
                            notes[notes.length - 1].durationSamples += hopSize;
                        } else {
                            notes.push({
                                note,
                                velocity,
                                startSamples: i,
                                durationSamples: hopSize,
                                startTime: i / sampleRate
                            });
                        }
                    }
                }
            }

            return notes;
        }

        // 周波数を推定（オートコリレーション法）
        function estimateFrequency(data, startIndex, windowSize, sampleRate) {
            const maxLag = Math.floor(sampleRate / 50); // 50Hzまで
            let bestCorrelation = 0;
            let bestLag = 1;

            // ウィンドウをコピー
            const window = [];
            for (let i = 0; i < Math.min(windowSize, data.length - startIndex); i++) {
                window.push(data[startIndex + i]);
            }

            // オートコリレーションを計算
            for (let lag = 1; lag < Math.min(maxLag, window.length / 2); lag++) {
                let correlation = 0;
                for (let i = 0; i < window.length - lag; i++) {
                    correlation += window[i] * window[i + lag];
                }
                if (correlation > bestCorrelation) {
                    bestCorrelation = correlation;
                    bestLag = lag;
                }
            }

            if (bestLag > 0) {
                return sampleRate / bestLag;
            }
            return 0;
        }

        // 周波数からMIDIノート番号に変換
        function frequencyToMidiNote(freq) {
            if (freq <= 0) return 60;
            // MIDI note = 69 + 12 * log2(f / 440)
            const note = Math.round(12 * Math.log2(freq / 440) + 69);
            return Math.max(0, Math.min(127, note));
        }

        // MIDI生成
        function generateMIDI(notes, bpm, instrument, totalDuration) {
            const ticksPerBeat = 480;
            const secondsPerBeat = 60 / bpm;
            const trackData = [];

            // Set tempo
            const tempo = Math.round(60000000 / bpm);
            trackData.push(0x00, 0xFF, 0x51, 0x03);
            trackData.push((tempo >> 16) & 0xFF, (tempo >> 8) & 0xFF, tempo & 0xFF);

            // Program change
            trackData.push(0x00, 0xC0, instrument);

            let lastTick = 0;

            // ノートを追加
            for (const note of notes) {
                const tick = Math.round((note.startTime / secondsPerBeat) * ticksPerBeat);
                const durationTicks = Math.round((note.durationSamples / (note.durationSamples + 1)) * ticksPerBeat * 0.5);

                // Note on
                const deltaTime = tick - lastTick;
                trackData.push(...encodeVariableLength(deltaTime));
                trackData.push(0x90, note.note, note.velocity);

                // Note off
                trackData.push(...encodeVariableLength(Math.max(1, durationTicks)));
                trackData.push(0x80, note.note, 0x40);

                lastTick = tick + Math.max(1, durationTicks);
            }

            // 最後に時間を足す
            const endTick = Math.round((totalDuration / secondsPerBeat) * ticksPerBeat);
            const finalDelta = Math.max(1, endTick - lastTick);
            trackData.push(...encodeVariableLength(finalDelta));

            // End of track
            trackData.push(0x00, 0xFF, 0x2F, 0x00);

            // MIDIファイルの完成
            const data = [];
            data.push(0x4D, 0x54, 0x68, 0x64); // "MThd"
            data.push(0x00, 0x00, 0x00, 0x06); // Header length
            data.push(0x00, 0x00); // Format 0
            data.push(0x00, 0x01); // 1 track
            data.push((ticksPerBeat >> 8) & 0xFF, ticksPerBeat & 0xFF); // Ticks per beat

            data.push(0x4D, 0x54, 0x72, 0x6B); // "MTrk"
            data.push(...encodeLength(trackData.length)); // Track length
            data.push(...trackData);

            return new Uint8Array(data);
        }

        // Variable length quantity
        function encodeVariableLength(value) {
            const bytes = [];
            bytes.unshift(value & 0x7F);
            value >>= 7;
            while (value > 0) {
                bytes.unshift((value & 0x7F) | 0x80);
                value >>= 7;
            }
            return bytes;
        }

        // 32-bit length encoding
        function encodeLength(length) {
            return [
                (length >> 24) & 0xFF,
                (length >> 16) & 0xFF,
                (length >> 8) & 0xFF,
                length & 0xFF
            ];
        }

        // MIDIダウンロード
        function downloadMIDI(data, filename) {
            const blob = new Blob([data], { type: 'audio/midi' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
